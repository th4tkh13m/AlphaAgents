[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "alpha-agents"
version = "0.1.0"
description = "Harness-independent DGM agent search"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
codex = ["openai-codex==0.159.2"]
test = ["pytest>=8,<10"]

[project.scripts]
alpha-dgm = "alpha_agents.tree_search.cli:main"

[tool.setuptools.packages.find]
include = ["alpha_agents*"]
exclude = ["*.tests", "*.examples"]
namespaces = false

[tool.setuptools.package-data]
"alpha_agents.tree_search" = ["LICENSE", "mutators/coding_agents/codex/*.md", "bridges/androidworld/*.json", "bridges/androidworld/*.md", "examples/*.json", "examples/*.py", "examples/toy_harness/*.py"]

[tool.pytest.ini_options]
testpaths = ["alpha_agents/tree_search/tests"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"alpha_agents/tree_search/tests/test_androidworld*.py" = ["E402"]
